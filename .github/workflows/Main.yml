name: build-tools
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: |
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o giftfetch ./cmd/giftfetch
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o appearancefetch ./cmd/appearancefetch
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create tools-1 giftfetch appearancefetch --title tools-1 --notes tools
